name = "infotheorylib"
version = "0.1.0"
description = "A Lean 4 library of information theory, built on Mathlib"
keywords = ["math", "information theory", "entropy", "probability"]
defaultTargets = ["InfoTheoryLib"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "InfoTheoryLib"
