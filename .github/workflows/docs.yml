name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Lets the GITHUB_TOKEN deploy to GitHub Pages.
permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@main
        with:
          api-docs: true
          build-page: false
          blueprint: false
          references: docs/references.bib
          deploy: true
